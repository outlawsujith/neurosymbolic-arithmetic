[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nesy-energy"
version = "0.1.0"
description = "Neurosymbolic energy optimisation for industrial plants: neural load forecasting, rule-based reasoning and explainable MILP scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.9", "fastapi>=0.100", "uvicorn>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
nesy-energy = "nesy_energy.cli:main"

[tool.setuptools]
packages = ["nesy_energy"]

[tool.setuptools.package-data]
nesy_energy = ["static/*.html"]
